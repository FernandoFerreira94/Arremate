<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>og</title><style>
:root{--bg:#F6F3EC;--surface:#FFFDF8;--muted:#EEE9DE;--border:#DDD5C4;--ink:#1F1B16;--ink-2:#5C5448;--ink-3:#7A705F;
--primary:#6E1E2B;--primary-h:#5A1722;--primary-fg:#FFF8F0;--accent:#A9823A;--accent-soft:#F3E8D0;
--live:#B42318;--live-soft:#FBE9E7;--sched:#2F5D8A;--sched-soft:#E6EEF6;--closed:#5C5448;--closed-soft:#ECE7DD;
--ok:#1E6B45;--ok-soft:#E3F1E8;--warn:#8A5300;--warn-soft:#FBEFD9;--err:#B42318;--err-soft:#FBE9E7;--info:#2F5D8A;--info-soft:#E6EEF6;
--ring:#A9823A;--r-sm:4px;--r-md:6px;--r-lg:10px;--r-xl:14px;
--sh-sm:0 1px 2px rgba(31,27,22,.08);--sh-md:0 2px 8px rgba(31,27,22,.10);--sh-lg:0 12px 32px rgba(31,27,22,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:var(--ink);background:#D9D3C6;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.serif{font-family:Fraunces,serif;font-optical-sizing:auto}
.num{font-variant-numeric:tabular-nums}
.board{padding:40px;}
.bh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:24px}
.bh h1{font-family:Fraunces,serif;font-size:34px;font-weight:600}
.bh p{color:var(--ink-2);max-width:760px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);border:1px solid #E9CF9C}
.frame{background:var(--bg);box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden;position:relative}
.flabel{font-size:12px;font-weight:600;color:#3d372e;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.flabel b{background:#1F1B16;color:#fff;border-radius:4px;padding:1px 6px;font-size:11px}
.note{font-size:12px;color:#3d372e;background:#fff8;border-left:3px solid var(--accent);padding:6px 10px;margin-top:8px;border-radius:0 4px 4px 0}
.ic{flex:none;vertical-align:middle}
/* shell */
.top{height:64px;display:flex;align-items:center;gap:24px;padding:0 40px;background:var(--surface);border-bottom:1px solid var(--border)}
.top nav{display:flex;gap:4px;margin-left:16px}
.top nav a{padding:8px 12px;border-radius:var(--r-md);color:var(--ink-2);font-weight:500;text-decoration:none}
.top nav a.on{color:var(--ink);background:var(--muted)}
.sp{flex:1}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:600;font-size:20px;letter-spacing:-.01em}
.sim{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border:1px solid #E9CF9C;padding:2px 8px;border-radius:99px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;font-family:Inter}
.btn.p{background:var(--primary);color:var(--primary-fg);box-shadow:var(--sh-sm)}
.btn.o{background:var(--surface);border-color:var(--border);color:var(--ink)}
.btn.g{background:transparent;color:var(--ink)}
.btn.d{background:var(--err);color:#fff}
.btn.lg{height:48px;padding:0 22px;font-size:15px}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.dis{opacity:.5}
.btn.focus{outline:2px solid var(--ring);outline-offset:2px}
.btn.hov.p{background:var(--primary-h)}
.input{height:44px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:15px}
.input.err{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.input.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lbl{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
.help{font-size:12px;color:var(--ink-3);margin-top:6px}
.help.e{color:var(--err);display:flex;gap:6px;align-items:flex-start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-live{background:var(--live-soft);color:var(--live)}.b-live:before{content:"";width:7px;height:7px;border-radius:9px;background:var(--live)}
.b-sched{background:var(--sched-soft);color:var(--sched)}.b-closed{background:var(--closed-soft);color:var(--closed)}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-err{background:var(--err-soft);color:var(--err)}.b-info{background:var(--info-soft);color:var(--info)}
.b-ext{background:var(--accent-soft);color:#6B5220}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);border:1px solid;font-size:13px;align-items:flex-start}
.alert b{display:block;font-size:14px;margin-bottom:2px}
.a-err{background:var(--err-soft);border-color:#F2C4BE;color:#7A1A12}.a-ok{background:var(--ok-soft);border-color:#B9DCC6;color:#14492F}
.a-warn{background:var(--warn-soft);border-color:#E9CF9C;color:#5E3A00}.a-info{background:var(--info-soft);border-color:#C3D5E8;color:#1E3F60}
.tabs{display:inline-flex;background:var(--muted);border-radius:var(--r-md);padding:4px;gap:2px}
.tabs span{padding:7px 14px;border-radius:var(--r-sm);font-weight:600;color:var(--ink-2);font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs span.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
.tabs .ct{font-size:11px;background:var(--border);border-radius:9px;padding:0 6px}
.art{width:100%;object-fit:cover;display:block;background:var(--muted)}
.ph{background:repeating-linear-gradient(45deg,var(--muted),var(--muted) 10px,#E6E0D3 10px,#E6E0D3 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-2);gap:6px;font-size:12px;font-weight:600;text-align:center}
.sk{background:linear-gradient(90deg,#E9E3D7,#F2EEE5,#E9E3D7);border-radius:4px}
.muted{color:var(--ink-2)}.small{font-size:12px}.xs{font-size:11px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column}
.grid{display:grid;gap:24px}
.lot .meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.lot h3{font-family:Fraunces,serif;font-size:18px;font-weight:600;line-height:1.2}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kv span:first-child{color:var(--ink-2)}
.price{font-family:Fraunces,serif;font-weight:600;font-variant-numeric:tabular-nums}
.foot{padding:20px 40px;border-top:1px solid var(--border);color:var(--ink-3);font-size:12px;display:flex;justify-content:space-between;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-align:left;color:var(--ink-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid #ECE6DA;font-size:13px}
.dialog{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:24px;border:1px solid var(--border)}
.overlay{position:absolute;inset:0;background:rgba(31,27,22,.45);display:flex;align-items:center;justify-content:center}
.mtop{height:56px;display:flex;align-items:center;padding:0 16px;gap:10px;background:var(--surface);border-bottom:1px solid var(--border)}
.mbar{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 20px;box-shadow:0 -4px 16px rgba(31,27,22,.08)}
h2.s{font-family:Fraunces,serif;font-size:22px;font-weight:600;margin-bottom:12px}
.sec{background:#F3EFE7;border-radius:12px;padding:24px;margin-bottom:24px}
.sec>h2{font-family:Fraunces,serif;font-size:24px;margin-bottom:4px}
.sec>p.d{color:var(--ink-2);margin-bottom:16px;font-size:13px}
.cred{font-size:11px;color:var(--ink-3)}
</style></head><body style="margin:0;background:#6E1E2B" style="width:1200px"><div style="zoom:2.5"><div style="width:480px;height:252px;background:#6E1E2B;display:flex;overflow:hidden"><div style="flex:1;padding:28px;color:#FFF8F0;display:flex;flex-direction:column;justify-content:space-between"><div class="row"><svg width="36" height="36" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="6" fill="#5A1722"/><rect x="5" y="5" width="22" height="22" rx="2" fill="none" stroke="#A9823A" stroke-width="1.5"/><text x="16" y="22.5" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="#FFF8F0">A</text></svg><span class="serif" style="font-size:22px;font-weight:600">Arremate</span></div><div><div class="serif" style="font-size:26px;font-weight:600;line-height:1.15">Leilões de arte de acervo público</div><div style="font-size:13px;opacity:.85;margin-top:8px">Demonstração com valores simulados</div></div></div><div style="width:180px"><img class="art " style="height:252px" src="../assets/meta/og-art-436535.jpg" alt="Campo de trigo com ciprestes, Vincent van Gogh, 1889"></div></div></div></body></html>
