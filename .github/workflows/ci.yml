name: Qualidade
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: auction_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: casadeleilao_test
        ports:
          - 5463:5432
        options: --health-cmd "pg_isready -U auction_owner -d casadeleilao_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://auction_app:ci-only-app-password@127.0.0.1:5463/casadeleilao_test
      TEST_DATABASE_URL: postgresql://auction_app:ci-only-app-password@127.0.0.1:5463/casadeleilao_test
      DB_OWNER_PASSWORD: ci-only-password
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Papel de runtime isolado do owner
        env:
          PGPASSWORD: ci-only-password
          POSTGRES_USER: auction_owner
          POSTGRES_DB: casadeleilao_test
          PGHOST: 127.0.0.1
          PGPORT: 5463
          APP_DATABASE_PASSWORD: ci-only-app-password
        run: sh infra/postgres/init-app-user.sh
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
